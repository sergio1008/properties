server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: productos-route
              uri: lb://productos
              predicates:
                - Path=/api/productos/**
              filters:
                - StripPrefix=1            
